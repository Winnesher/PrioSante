{% extends "base.html" %}

{% block title %}Connexion Personnel : PrioSanté{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 450px; margin: 3rem auto;">
    <h2 style="text-align: center; margin-bottom: 0.5rem; font-weight: 800;" data-i18n="login.title">Espace Personnel Hospitalier</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem;" data-i18n="login.subtitle">
        Accès sécurisé pour le compte Réceptionniste ou Médecin.
    </p>

    <form action="{{ url_for('staff.login') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label" data-i18n="login.username">Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" data-i18n-placeholder="login.usernamePh" placeholder="Votre identifiant" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" data-i18n="login.password">Mot de passe</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span data-i18n="login.submit">Se Connecter au Dashboard</span>
        </button>
    </form>
</div>
{% endblock %}

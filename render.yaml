services:
  - type: web
    name: priosante
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: PRIOSANTE_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: priosante-db
          property: connectionString

databases:
  - name: priosante-db
    plan: free
    region: frankfurt
